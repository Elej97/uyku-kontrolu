<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Göz Kapakları Uyku Modu Kontrolü</title>
    <meta name="description" content="MediaPipe Face Mesh ile web tarayıcısında gerçek zamanlı göz kapağı takibi ve uyku modu geçiş sistemi.">
    
    <!-- MediaPipe CDNs -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #webcam {
            display: none;
        }

        #output_canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Sol Üst Yuvarlak Geri Sayım Göstergesi (Python GUI stili) */
        .countdown-overlay {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 10;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(20, 20, 20, 0.45);
        }

        .circle-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 120px;
            height: 120px;
            transform: rotate(-90deg);
            transform-origin: center;
        }

        .circle-bg {
            fill: none;
            stroke: rgba(60, 60, 60, 0.8);
            stroke-width: 10;
        }

        .circle-progress {
            fill: none;
            stroke: #00e676; /* yeşil */
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        .countdown-number {
            position: absolute;
            font-size: 2.8rem;
            font-weight: bold;
            color: #ff1744; /* kırmızı */
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            z-index: 12;
        }

        .countdown-dots {
            position: absolute;
            display: flex;
            gap: 6px;
            z-index: 12;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(130, 130, 130, 0.8);
        }

        /* Alt Bilgi Çubuğu (Python GUI stili) */
        .status-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            background: #121212;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-size: 0.95rem;
            z-index: 10;
            color: #969696;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-text {
            font-weight: 500;
        }

        .ear-info {
            color: #c8c8c8;
        }

        /* Gizli Ayarlar Paneli (Klavye ile 's' tuşuna basarak veya ekrana tıklayarak açılabilir) */
        .settings-overlay {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(18, 18, 18, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 25px;
            z-index: 100;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .settings-overlay.show {
            display: block;
        }

        .settings-overlay h3 {
            margin-bottom: 15px;
            color: #fff;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: #8b9bb4;
            margin-bottom: 5px;
        }

        .input-group input[type="text"] {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .range-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .range-wrapper span {
            color: #29b6f6;
            font-size: 0.9rem;
            min-width: 35px;
            font-weight: bold;
        }

        .close-btn {
            background: #29b6f6;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="container" onclick="handleContainerClick(event)">
        <!-- Sol Üst Geri Sayım Çemberi -->
        <div class="countdown-overlay" id="countdownContainer">
            <svg width="120" height="120" class="circle-svg">
                <circle cx="60" cy="60" r="50" class="circle-bg" />
                <circle cx="60" cy="60" r="50" class="circle-progress" id="progressCircle" stroke-dasharray="314.16" stroke-dashoffset="314.16" />
            </svg>
            <div class="countdown-number" id="countdownNum"></div>
            <div class="countdown-dots" id="countdownDots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>

        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>

        <!-- Alt Bilgi Çubuğu -->
        <div class="status-bar">
            <div class="status-text" id="statusText">Gözler bekleniyor...</div>
            <div class="ear-info" id="earInfo">EAR Sol: 0.000 | EAR Sağ: 0.000 | Eşik: 0.21</div>
        </div>

        <!-- Gizli Ayarlar Paneli (Ekrana çift tıklayarak veya 'S' tuşuna basarak açılır) -->
        <div class="settings-overlay" id="settingsOverlay">
            <h3>⚙️ Ayarlar</h3>
            
            <div class="input-group">
                <label for="thresholdSlider">Göz Kapalı Eşiği (EAR Eşiği)</label>
                <div class="range-wrapper">
                    <input type="range" id="thresholdSlider" min="0.12" max="0.30" step="0.01" value="0.21">
                    <span id="thresholdVal">0.21</span>
                </div>
            </div>

            <div class="input-group">
                <label for="targetSlider">Geri Sayım Süresi (Saniye)</label>
                <div class="range-wrapper">
                    <input type="range" id="targetSlider" min="1" max="10" step="1" value="3">
                    <span id="targetVal">3s</span>
                </div>
            </div>

            <div class="input-group">
                <label for="cooldownSlider">Tekrar Tetiklenme Beklemesi (Saniye)</label>
                <div class="range-wrapper">
                    <input type="range" id="cooldownSlider" min="5" max="60" step="5" value="15">
                    <span id="cooldownVal">15s</span>
                </div>
            </div>

            <div class="input-group">
                <label for="youtubeUrlInput">Video Linki</label>
                <input type="text" id="youtubeUrlInput" value="https://www.youtube.com/shorts/_EiWd-7-hLM">
            </div>

            <button class="close-btn" onclick="toggleSettings()">Kaydet ve Kapat</button>
            <p style="font-size: 0.7rem; color: #8b9bb4; text-align: center; margin-top: 10px;">
                (Ayarları açmak/kapatmak için 'S' tuşuna basabilirsin)
            </p>
        </div>
    </div>

    <script>
        // DOM Elements
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output_canvas');
        const canvasCtx = canvasElement.getContext('2d');
        
        const statusText = document.getElementById('statusText');
        const earInfo = document.getElementById('earInfo');
        
        const thresholdSlider = document.getElementById('thresholdSlider');
        const thresholdValEl = document.getElementById('thresholdVal');
        
        const targetSlider = document.getElementById('targetSlider');
        const targetValEl = document.getElementById('targetVal');
        
        const cooldownSlider = document.getElementById('cooldownSlider');
        const cooldownValEl = document.getElementById('cooldownVal');
        
        const youtubeUrlInput = document.getElementById('youtubeUrlInput');
        const settingsOverlay = document.getElementById('settingsOverlay');
        
        const progressCircle = document.getElementById('progressCircle');
        const countdownNum = document.getElementById('countdownNum');
        const countdownDots = document.getElementById('countdownDots');

        // Dynamic State Variables
        let earThreshold = parseFloat(thresholdSlider.value);
        let countdownTarget = parseInt(targetSlider.value);
        let cooldownSeconds = parseInt(cooldownSlider.value);
        let youtubeUrl = youtubeUrlInput.value;

        let eyesClosedSince = null;
        let lastTriggered = 0;

        // Listeners for adjustments
        thresholdSlider.addEventListener('input', (e) => {
            earThreshold = parseFloat(e.target.value);
            thresholdValEl.textContent = earThreshold.toFixed(2);
            updateStatusText();
        });

        targetSlider.addEventListener('input', (e) => {
            countdownTarget = parseInt(e.target.value);
            targetValEl.textContent = countdownTarget + 's';
        });

        cooldownSlider.addEventListener('input', (e) => {
            cooldownSeconds = parseInt(e.target.value);
            cooldownValEl.textContent = cooldownSeconds + 's';
        });

        youtubeUrlInput.addEventListener('input', (e) => {
            youtubeUrl = e.target.value;
        });

        // Toggle Settings overlay via keyboard or button
        function toggleSettings() {
            settingsOverlay.classList.toggle('show');
        }

        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 's') {
                toggleSettings();
            }
        });

        // Click outside settings to close or double-click to open
        let lastClick = 0;
        function handleContainerClick(e) {
            const now = Date.now();
            if (now - lastClick < 300) {
                // Double click detection to toggle settings
                toggleSettings();
            }
            lastClick = now;
        }

        // Circle circumference (2 * PI * r) where r = 50 -> 314.16
        const strokeCircumference = 314.16;

        function setCountdownProgress(elapsedRatio) {
            const offset = strokeCircumference - (elapsedRatio * strokeCircumference);
            progressCircle.style.strokeDashoffset = offset;
        }

        // Mathematical Helpers
        function getDistance(p1, p2, width, height) {
            return Math.sqrt(Math.pow((p1.x - p2.x) * width, 2) + Math.pow((p1.y - p2.y) * height, 2));
        }

        function calculateEAR(eyePoints, landmarks, width, height) {
            const top = landmarks[eyePoints[0]];
            const bottom = landmarks[eyePoints[1]];
            const left = landmarks[eyePoints[2]];
            const right = landmarks[eyePoints[3]];

            const verticalDist = getDistance(top, bottom, width, height);
            const horizontalDist = getDistance(left, right, width, height);

            if (horizontalDist === 0) return 0.0;
            return verticalDist / horizontalDist;
        }

        // Landmark indices
        const RIGHT_EYE = [159, 145, 33, 133];
        const LEFT_EYE = [386, 374, 362, 263];

        function onResults(results) {
            if (canvasElement.width !== window.innerWidth) {
                canvasElement.width = window.innerWidth;
                canvasElement.height = window.innerHeight;
            }

            const width = canvasElement.width;
            const height = canvasElement.height;

            canvasCtx.save();
            canvasCtx.clearRect(0, 0, width, height);
            
            // Draw video frames mirrored horizontally
            canvasCtx.translate(width, 0);
            canvasCtx.scale(-1, 1);
            canvasCtx.drawImage(results.image, 0, 0, width, height);
            canvasCtx.restore();

            let eyesClosed = false;
            let earR = 0.0;
            let earL = 0.0;

            if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                const landmarks = results.multiFaceLandmarks[0];

                earR = calculateEAR(RIGHT_EYE, landmarks, width, height);
                earL = calculateEAR(LEFT_EYE, landmarks, width, height);

                earInfo.textContent = `EAR Sol: ${earL.toFixed(3)} | EAR Sağ: ${earR.toFixed(3)} | Eşik: ${earThreshold}`;

                // Both eyes closed
                if (earR < earThreshold && earL < earThreshold) {
                    eyesClosed = true;
                }

                // Draw eye landmarks (yellow dots, mirrored)
                canvasCtx.fillStyle = '#ffff00';
                [...RIGHT_EYE, ...LEFT_EYE].forEach(idx => {
                    const pt = landmarks[idx];
                    const px = (1 - pt.x) * width;
                    const py = pt.y * height;
                    canvasCtx.beginPath();
                    canvasCtx.arc(px, py, 3, 0, 2 * Math.PI);
                    canvasCtx.fill();
                });
            } else {
                earInfo.textContent = `Gözler algılanamadı.`;
            }

            // Geri Sayım ve Tetikleme Mantığı
            const now = Date.now();
            const elapsedCooldown = Math.max(0, Math.ceil(cooldownSeconds - (now - lastTriggered) / 1000));

            if (elapsedCooldown > 0) {
                statusText.style.color = "#ffaa00";
                statusText.textContent = `Bekleniyor - tekrar ${elapsedCooldown}s sonra aktif`;
                
                countdownNum.style.display = "none";
                countdownDots.style.display = "flex";
                setCountdownProgress(0);
                eyesClosedSince = null;
            } else {
                countdownDots.style.display = "none";
                
                if (eyesClosed) {
                    statusText.style.color = "#00ff55";
                    if (eyesClosedSince === null) {
                        eyesClosedSince = now;
                    }
                    const elapsed = (now - eyesClosedSince) / 1000;
                    const remaining = Math.max(0, Math.ceil(countdownTarget - elapsed));
                    
                    statusText.textContent = `Gözler Kapalı! ${remaining}s sonra uyku moduna geçiliyor...`;

                    countdownNum.style.display = "block";
                    countdownNum.textContent = remaining;
                    
                    setCountdownProgress(Math.min(elapsed / countdownTarget, 1.0));

                    // Tetikleme (Pop-up engeline takılmadan direkt sayfayı yönlendirir)
                    if (elapsed >= countdownTarget) {
                        lastTriggered = now;
                        eyesClosedSince = null;
                        
                        // Direkt Yönlendirme (Asla tarayıcı tarafından engellenmez)
                        window.location.href = youtubeUrl;
                    }
                } else {
                    statusText.style.color = "#969696";
                    statusText.textContent = "Gözler açık (Uyku Bekleniyor)...";
                    
                    countdownNum.style.display = "none";
                    countdownDots.style.display = "flex";
                    setCountdownProgress(0);
                    eyesClosedSince = null;
                }
            }
        }

        function updateStatusText() {
            earInfo.textContent = `EAR Sol: 0.000 | EAR Sağ: 0.000 | Eşik: ${earThreshold}`;
        }

        // Initialize FaceMesh Detector
        const faceMesh = new FaceMesh({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
        });

        faceMesh.setOptions({
            maxNumFaces: 1,
            refineLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        faceMesh.onResults(onResults);

        // Start Webcam Feed via camera_utils
        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await faceMesh.send({ image: videoElement });
            },
            width: 1280,
            height: 720
        });

        camera.start()
            .then(() => {
                statusText.style.color = "#969696";
                statusText.textContent = "Gözler açık (Uyku Bekleniyor)...";
            })
            .catch(err => {
                statusText.style.color = "#ff0000";
                statusText.textContent = "Hata: Kamera başlatılamadı!";
                console.error(err);
            });
    </script>
</body>
</html>
